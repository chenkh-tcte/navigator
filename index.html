<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="zh-tw">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="content-language" content="zh-tw" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge, chrome=1">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
	<meta http-equiv="Pragma" content="no-cache">
	<meta http-equiv="Pragma" content="NO-STORE">
	<meta http-equiv="Expires" content="-1">
	<title>Navigator</title>
	<style>
	body {
		background-color: black;
		color: white;
	}
	textarea {
		background-color: black;
		color: white;
	}
	</style>
	<script>
		console.log((new Date).toLocaleString());
		function getWeekNumber(d) {
			d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
			d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
			var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
			var weekNo = Math.ceil(( ( (d - yearStart) / 86400000) + 1)/7);
			return weekNo;
		}
		
		function do_current_time() {
			var now = new Date();
			const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
			const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];

			var day = days[ now.getDay() ];
			var month = months[ now.getMonth() ];		
			var obj = document.getElementById("current_time");
			obj.innerHTML = now.toLocaleString()
				+ "<br />" + "NoME:the number of milliseconds for this date since the epoch, which is defined as the midnight at the beginning of January 1, 1970, UTC."
				+ "<br />NoME:" + now.getTime()
				+ "<br />Year:" + now.getFullYear()
				+ "<br />Month:" + month
				+ "<br />Days:" + now.getDate()
				+ "<br />Days of the week:" + day
				+ "<br />Week Number:" + getWeekNumber(now)
				;
			setTimeout(do_current_time, 1);
		}
		
		function form_column_value1_onchange() {
			try {
				document.getElementById("form_column_value_result").innerHTML = eval(form1.form_column_value1.value);
			} catch (e) {
				console.warn((new Date).toLocaleString(), e);
			}
		}
		
		function body_onload() {
			do_current_time();
		}
	</script>
</head>
<body onload="body_onload()">
	<h1>Naviagtor</h1>
	<h3>
		<div id="current_time"></div>
	</h3>
	<h3>
		<form name="form1">
		<textarea name="form_column_value1" onkeyup="form_column_value1_onchange()" cols="55" rows="20"></textarea>		
		<div id="form_column_value_result"></div>
		</form>
	</h3>

	
<div>
  <button id="camera">Cam</button>
  <button id="screen">Screen</button>
  <button id="screenshot">Capture</button>
  <button id="screenshot-download">Download Capture</button>
  <button id="video-start">Video</button>
  <button id="video-download">Download Video</button>
  <button id="recording-start">Voice</button>
  <button id="recording-download">Download Voice</button>
  <button id="stop">Stop</button>
</div>

<div>
  <video id="video"></video>
  <img id="img">
  <canvas id="canvas" style="display: none;"></canvas>
</div>

<script>
let cameraStream
const camera = document.querySelector('#camera')
const stop = document.querySelector('#stop')
const video = document.querySelector('#video')

const constraints = { audio: true, video: true }
camera.addEventListener('click', () => {
  navigator.mediaDevices.getUserMedia(constraints).then(stream => {
    cameraStream = stream
    video.srcObject = stream
    video.play()
  })
})

stop.addEventListener('click', () => {
  if (cameraStream) {
    cameraStream.getTracks().forEach(track => {
      track.stop()
    })
    cameraStream = null
  }
})


let screenStream
const screen = document.querySelector('#screen')

function stopAllStream () {
  if (cameraStream) {
    cameraStream.getTracks().forEach(track => {
      track.stop()
    })
    cameraStream = null
  }
  if (screenStream) {
    screenStream.getTracks().forEach(track => {
      track.stop()
    })
    screenStream = null
  }
}

camera.addEventListener('click', () => {
  navigator.mediaDevices.getUserMedia(constraints).then(stream => {
    stopAllStream()
    cameraStream = stream
    video.srcObject = stream
    video.play()
  })
})

screen.addEventListener('click', () => {
  navigator.mediaDevices.getDisplayMedia(constraints).then(stream => {
    stopAllStream()
    screenStream = stream
    video.srcObject = stream
    video.play()
  })
})

stop.addEventListener('click', stopAllStream)


let screenshotBlobUrl
const screenshot = document.querySelector('#screenshot')
const screenshotDownload = document.querySelector('#screenshot-download')
const img = document.querySelector('#img')
const canvas = document.querySelector('#canvas')
const ctx = canvas.getContext('2d')

screenshot.addEventListener('click', () => {
  if (!cameraStream && !screenStream) return
  const width = video.offsetWidth
  const height = video.offsetHeight
  canvas.width = width
  canvas.height = height
  ctx.drawImage(video, 0, 0, width, height)
  canvas.toBlob(blob => {
    screenshotBlobUrl = window.URL.createObjectURL(blob)
    img.src = screenshotBlobUrl
  })
})

screenshotDownload.addEventListener('click', () => {
  if (!screenshotBlobUrl) return
  const downloadLink = document.createElement('a')
  downloadLink.href = screenshotBlobUrl
  downloadLink.download = 'fileName'
  downloadLink.click()
})

let videoMediaRecorder
let recordingMediaRecorder
const videoStart = document.querySelector('#video-start')
const videoDownload = document.querySelector('#video-download')
const recordingStart = document.querySelector('#recording-start')
const recordingDownload = document.querySelector('#recording-download')

videoStart.addEventListener('click', () => {
  if (!cameraStream && !screenStream) return
  const currentStream = cameraStream || screenStream
  const options = {
    audioBitsPerSecond: 128000,
    videoBitsPerSecond: 2500000,
    mimeType: 'video/webm'
  }
  const mediaRecorder = new MediaRecorder(currentStream, options)
  videoMediaRecorder = mediaRecorder
  mediaRecorder.addEventListener('dataavailable', e => {
    const blob = new Blob([e.data], { type: 'video/mp4' })
    const downloadLink = document.createElement('a')
    downloadLink.href = window.URL.createObjectURL(blob)
    downloadLink.download = 'videoName'
    downloadLink.click()
  })
  mediaRecorder.start()
})

videoDownload.addEventListener('click', () => {
  if (!videoMediaRecorder) return
  videoMediaRecorder.stop()
})

recordingStart.addEventListener('click', () => {
  if (!cameraStream && !screenStream) return
  const currentStream = cameraStream || screenStream
  const options = {
    audioBitsPerSecond: 128000,
    mimeType: 'audio/webm'
  }
  const mediaRecorder = new MediaRecorder(currentStream, options)
  recordingMediaRecorder = mediaRecorder
  mediaRecorder.addEventListener('dataavailable', e => {
    const blob = new Blob([e.data], { type: 'audio/mp4' })
    const downloadLink = document.createElement('a')
    downloadLink.href = window.URL.createObjectURL(blob)
    downloadLink.download = 'recordingName'
    downloadLink.click()
  })
  mediaRecorder.start()
})

recordingDownload.addEventListener('click', () => {
  if (!recordingMediaRecorder) return
  recordingMediaRecorder.stop()
})
</script>
	
</body>
</html>
